# Official DeepSeek Chat Completions. Verified against official docs 2026-10-30.
extends: phase1.yaml
name: phase1_deepseek
experiment:
  output: runs/phase1_deepseek
agent:
  output: runs/agent_data_deepseek
llm:
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  model_env: DEEPSEEK_MODEL
